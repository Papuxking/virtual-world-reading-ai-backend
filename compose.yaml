# ============================================================================
# Docker Compose — Virtual World Reading API
# Servicios: PostgreSQL + FastAPI + Adminer + Dashboard Admin
# Puerto externo de la API: 8001 (para coexistir con LecturaIA en 8000)
# Puerto externo del Dashboard: 5173
# ============================================================================

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: DB-virtual-world-reading-ai
      POSTGRES_PASSWORD: GodotWorldAdmin
      POSTGRES_DB: godot_readings
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/sql:/docker-entrypoint-initdb.d
    ports:
      - 5433:5432

  api:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./api:/app
      - .:/data:ro
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4"
    ports:
      - 8001:8000
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://DB-virtual-world-reading-ai:GodotWorldAdmin@db:5432/godot_readings
      SYNC_SECRET_KEY: lecturaia-vw-sync-2024
      LECTURAIA_API_URL: http://host.docker.internal:8000
      JWT_SECRET_KEY: virtual-world-jwt-secret-2026-change-in-production
      PUBLIC_ORIGIN: http://localhost:5173

  dashboard:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - dashboard_modules:/app/node_modules
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - 5173:5173
    depends_on:
      - api

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  pgdata:
  dashboard_modules:
