# REFERENCIA del nginx de PRODUCCIÓN unificada (/opt/pila/nginx.conf),
# tomado el 22-oct-2026. Sin secretos. Solo lectura de la topología.
#
# Puerto 80: todo a HTTPS.
#
# El juego tiene que ir por HTTPS si o si. Godot web usa AudioWorklet y
# los navegadores solo lo exponen en contexto seguro; por HTTP plano
# falla con "Cannot read properties of undefined (reading 'addModule')".
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    # Comodin de la universidad: vale para cualquier nombre bajo
    # uta.edu.ec, asi que el subdominio puede cambiar sin tocar esto.
    server_name comprensionlectoradigital.uta.edu.ec *.uta.edu.ec 10.102.100.199;

    # fullchain = certificado del dominio + cadena intermedia. Sin la
    # cadena, los navegadores de escritorio suelen apanarselas pero los
    # moviles dan error de autoridad desconocida.
    ssl_certificate     /etc/nginx/tls/fullchain.crt;
    ssl_certificate_key /etc/nginx/tls/dominio.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=86400" always;

    root /var/www/juego;
    index index.html;

    client_max_body_size 25m;
    gzip_static on;
    sendfile on;
    tcp_nopush on;

    # Sin COOP/COEP: el build va con thread_support=false y no necesita
    # aislamiento de origen cruzado. Ponerlas solo romperia subrecursos.

    location ~* \.(pck|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /dashboard/ {
        alias /var/www/dashboard/;
        try_files $uri $uri/ /dashboard/index.html;
    }

    # API del entorno virtual. Al anadir un router nuevo hay que sumar su
    # prefijo aqui o devolvera 404 aunque en local funcione.
    location ~ ^/(auth|progress|readings|typologies|leaderboard|achievements|admin|workspaces|static|health|docs|openapi\.json) {
        proxy_pass http://vw-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /npc/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /api/v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Con ^~ para ganar al regex de la API de VW, que si no se quedaria
    # con /lecturaia/readings y /lecturaia/admin.
    location ^~ /lecturaia/ {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Sin barra. No redirigir a /lecturaia/: Next normaliza al reves y las
    # dos redirecciones entran en bucle.
    location = /lecturaia {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
