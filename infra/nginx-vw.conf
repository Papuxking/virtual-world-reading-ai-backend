# Mundo virtual de lectura — estaticos del juego, dashboard y proxy a la API.
# TLS lo inyecta certbot en Task 11.

server {
    server_name entornovirtual.duckdns.org;

    root /var/www/vw;
    index index.html;

    # El .pck ronda los 50 MB; las subidas de medallas son pequenas.
    client_max_body_size 20m;

    gzip_static on;
    sendfile on;
    tcp_nopush on;

    # Sin COOP/COEP: el build se exporta con thread_support=false y no
    # requiere cross-origin isolation. Anadirlas solo romperia subrecursos.

    # ── Estaticos del juego ──────────────────────────────────────────────
    location ~* \.(pck|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Dashboard de administracion (SPA) ────────────────────────────────
    location /dashboard/ {
        alias /var/www/vw-dashboard/;
        try_files $uri $uri/ /dashboard/index.html;
    }

    # ── API: prefijos que consume el cliente Godot y el dashboard ────────
    location ~ ^/(auth|progress|readings|typologies|leaderboard|achievements|admin|static|health|docs|openapi\.json) {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Tutor NPC: reservado para LecturaIA, aun no desplegada ───────────
    location /npc/ {
        return 503 '{"detail":"El tutor IA no esta disponible todavia."}';
        add_header Content-Type application/json always;
    }

    # ── Juego (raiz) ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/entornovirtual.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/entornovirtual.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = entornovirtual.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name entornovirtual.duckdns.org;
    return 404; # managed by Certbot


}