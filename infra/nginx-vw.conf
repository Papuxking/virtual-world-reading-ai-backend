# ============================================================================
#  nginx — entornovirtual.duckdns.org
#  Destino en el servidor: /etc/nginx/conf.d/vw.conf
#
#  ESTE FICHERO ES LA COPIA FIEL DE LA CONFIGURACION VIVA (rescatada del
#  servidor el 23-ago-2026). La version anterior del repo estaba TRES
#  generaciones por detras y desplegarla habria borrado las rutas de
#  LecturaIA, tumbando la pila de otro autor.
#
#  ZONAS AJENAS — NO EDITAR SIN HABLAR CON SU AUTOR:
#    location /npc/        -> 127.0.0.1:8002   (backend LecturaIA)
#    location ^~ /api/v1/  -> 127.0.0.1:8002   (backend LecturaIA)
#    location ^~ /lecturaia/ y location = /lecturaia -> 127.0.0.1:3001
#  Su codigo vive en /opt/lecturaia y NO se toca desde este repo.
#
#  ZONA PROPIA (entorno virtual):
#    location /                    -> estaticos Godot en /var/www/vw
#    location /dashboard/          -> SPA en /var/www/vw-dashboard
#    location ~ ^/(auth|progress|...)-> 127.0.0.1:8001 (API VW)
#
#  AL AÑADIR UN ROUTER NUEVO A LA API hay que anadir su prefijo al regex de
#  la API o nginx devolvera 404 en produccion aunque en local funcione.
#
#  Los bloques "managed by Certbot" los reescribe certbot al renovar: si
#  cambias el fichero, vuelve a copiarlo y ejecuta deploy.sh nginx.
# ============================================================================

# Mundo virtual de lectura — estaticos del juego, dashboard y proxy a la API.
# TLS lo inyecta certbot en Task 11.

server {
    server_name entornovirtual.duckdns.org;

    root /var/www/vw;
    index index.html;

    # El .pck ronda los 50 MB; las subidas de medallas son pequenas.
    client_max_body_size 20m;

    gzip_static on;
    sendfile on;
    tcp_nopush on;

    # Sin COOP/COEP: el build se exporta con thread_support=false y no
    # requiere cross-origin isolation. Anadirlas solo romperia subrecursos.

    # ── Estaticos del juego ──────────────────────────────────────────────
    location ~* \.(pck|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Dashboard de administracion (SPA) ────────────────────────────────
    location /dashboard/ {
        alias /var/www/vw-dashboard/;
        try_files $uri $uri/ /dashboard/index.html;
    }

    # ── API: prefijos que consume el cliente Godot y el dashboard ────────
    location ~ ^/(auth|progress|readings|typologies|leaderboard|achievements|admin|comics|static|health|docs|openapi\.json) {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Tutor NPC "robot": LecturaIA (contenedor separado, puerto 8002) ──
    location /npc/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── App web de LecturaIA (Next.js, contenedor en 3001) ───────────────
    # `^~` para que gane antes de evaluar el regex de la API de VW y no haya
    # sorpresas con rutas como /lecturaia/readings o /lecturaia/admin, que en
    # la app web son paginas propias, no endpoints de VW.
    location ^~ /lecturaia/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Sin barra final. NO redirigir a /lecturaia/: Next normaliza al reves
    # (308 hacia /lecturaia) y las dos redirecciones se pelean en bucle.
    location = /lecturaia {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── API de LecturaIA (modo web). El NPC del juego usa /npc/ ──────────
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Las respuestas del modelo pueden tardar; y subir un PDF tambien.
        proxy_read_timeout 180s;
    }

    # ── Juego (raiz) ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/entornovirtual.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/entornovirtual.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = entornovirtual.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name entornovirtual.duckdns.org;
    return 404; # managed by Certbot


}