# REFERENCIA de la pila de PRODUCCIÓN unificada (10.102.100.199), tomada de
# /opt/pila/compose.yaml el 22-oct-2026. Los secretos están REDACTADOS: en el
# servidor el JWT y la contraseña de Postgres van inline (conviene moverlos a
# .env). No desplegar esto tal cual; es solo para leer la topología en local.
#
# Una sola base para las dos aplicaciones: esquema public para LecturaIA y
# esquema vw para el entorno virtual. Nada se publica salvo nginx: el juego
# exportado a web pide las dos APIs al mismo origen desde el que se sirve
# (api_config.gd usa window.location.origin en web), así que todo sale por el
# mismo puerto.
name: tesis

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:                       # LecturaIA (del compañero) — NO tocar
    build:
      context: /opt/lecturaia/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    env_file: [.env]
    environment:
      APP_ENV: production
      APP_DEBUG: "False"
    volumes:
      - uploads:/app/storage/uploads

  web:                       # LecturaIA frontend (del compañero) — NO tocar
    build:
      context: /opt/lecturaia/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_BASE_PATH: /lecturaia
    restart: unless-stopped
    depends_on: [api]

  vw-api:                    # Entorno virtual (lo nuestro)
    build:
      context: /opt/vw
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      # Misma base, su propio esquema. Su código no cambia.
      DATABASE_URL: "postgresql://lecturaia:${POSTGRES_PASSWORD}@db:5432/lecturaia?options=-csearch_path%3Dvw"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      SYNC_SECRET_KEY: ""
      LECTURAIA_API_URL: "http://api:8000"
      PUBLIC_ORIGIN: "http://10.102.100.199"
    volumes:
      - medals:/app/static/medals

  nginx:                     # Única superficie pública
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, web, vw-api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/pila/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
      - /opt/pila/tls:/etc/nginx/tls:ro,z
      - /opt/web_build:/var/www/juego:ro,z
      - /opt/vw/dashboard/dist:/var/www/dashboard:ro,z

volumes:
  pgdata:
  uploads:
  medals:
