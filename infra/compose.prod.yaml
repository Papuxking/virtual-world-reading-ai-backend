# Produccion — solo loopback. nginx en el host es la unica superficie publica.
name: vw

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../api/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Etiquetada por despliegue (prod-AAAAMMDD-HHMMSS) para poder revertir a la
    # imagen anterior sin reconstruir. deploy.sh exporta API_TAG; a mano, sin
    # exportar nada, se comporta como antes y usa :latest.
    image: vw-api:${API_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SYNC_SECRET_KEY: ${SYNC_SECRET_KEY}
      LECTURAIA_API_URL: ${LECTURAIA_API_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      VW_DATA_ENCRYPTION_KEY: ${VW_DATA_ENCRYPTION_KEY:?Configura el cifrado de conversaciones}
      AUTO_MIGRATE: "0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    volumes:
      # Las medallas subidas por el admin deben sobrevivir a un rebuild
      - medals:/app/static/medals
      # JSON de lecturas para import_json_readings.py
      - ../LECTURAS_TIPOLOGIAS_TEXTUALES.json:/data/LECTURAS_TIPOLOGIAS_TEXTUALES.json:ro
    ports:
      - "127.0.0.1:8001:8000"

  migrate:
    image: vw-api:${API_TAG:-latest}
    profiles: [maintenance]
    command: ["python", "migrate.py"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Configura el rol migrador}

volumes:
  pgdata:
  medals:
