# Pila desechable: no publica puertos ni monta volúmenes de las aplicaciones.
services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: vw_test
      POSTGRES_PASSWORD: tests-only-isolated-database
      POSTGRES_DB: vw_security_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vw_test -d vw_security_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  api-tests:
    build:
      context: ..
      dockerfile: infra/Dockerfile.test
    working_dir: /app
    volumes:
      - ../api:/app:ro
    tmpfs:
      - /app/static/medals
    environment:
      TEST_DATABASE_URL: postgresql://vw_test:tests-only-isolated-database@test-db:5432/vw_security_test
      JWT_SECRET_KEY: isolated-tests-only-7e38e20f023a4974be36cf57411d6698
      VW_DATA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_ENV: test
      PUBLIC_ORIGIN: http://testserver
    depends_on:
      test-db:
        condition: service_healthy
  test-app:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
      - /app/static/medals:mode=0777
    ports:
      - "127.0.0.1:18001:8000"
    environment:
      DATABASE_URL: postgresql://vw_test:tests-only-isolated-database@test-db:5432/vw_security_test
      JWT_SECRET_KEY: isolated-tests-only-7e38e20f023a4974be36cf57411d6698
      VW_DATA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_ENV: test
      AUTO_MIGRATE: "0"
      PUBLIC_ORIGIN: http://127.0.0.1:15173
    depends_on:
      test-db:
        condition: service_healthy
